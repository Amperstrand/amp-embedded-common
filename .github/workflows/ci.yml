# CI workflow that uses the reusable rust-embedded.yml workflow.
# This serves as both the repo's own CI and a live test of the reusable workflow.
#
# The reusable workflow is tested end-to-end on every push/PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (via reusable workflow)
    # Use the reusable workflow with repo-specific values
    uses: Amperstrand/amp-embedded-common/.github/workflows/rust-embedded.yml@main
    with:
      # Pin to 1.92 like ccid-firmware-rs (most embedded repos use specific versions)
      toolchain: "1.92"

      # Clippy on thumbv7em-none-eabihf (common Cortex-M target)
      clippy-target: "thumbv7em-none-eabihf"

      # Host tests on x86_64 (the standard host target)
      test-target: "x86_64-unknown-linux-gnu"

      # No system dependencies needed for this simple library
      apt-packages: ""

      # Test all workspace crates
      test-flags: "--workspace"

      # Workspace is at repo root
      workspace-path: "."

  thumbv7em-build:
    name: Build for thumbv7em-none-eabihf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: thumbv7em-none-eabihf

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build for thumbv7em-none-eabihf
        run: cargo build --target thumbv7em-none-eabihf --features cortex-m